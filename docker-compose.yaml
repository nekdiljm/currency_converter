  services:
    app:
      env_file:
        - .env
      build:
        context: .
        dockerfile: Dockerfile
      container_name: currency-converter
      restart: unless-stopped
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy

    postgres:
      image: postgres:17
      container_name: currency_converter-postgres
      restart: always
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASS}
        POSTGRES_DB: ${POSTGRES_DB}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
        interval: 5s
        timeout: 5s
        retries: 10
    redis:
      image: redis:latest
      container_name: currency-converter-redis
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      healthcheck:
        test: [ "CMD", "redis-cli", "ping" ]
        interval: 5s
        timeout: 3s
        retries: 10

  volumes:
    postgres_data:
    redis_data:


